name: Correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    env:
      LUCE_TEST_GPU: optional
      LUCE_TEST_WINDOW: optional
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-std
      # the compiler is built apart, with luce-std's main (every dependency is at main,
      # luce-base docs/CI.md), so that this commit's API changes test this package rather
      # than the compiler's own use of luce-std
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-base
          path: compiler/luce-base
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-std
          path: compiler/luce-std
      # the package's program checks use luce-base's tools beside this checkout
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-base
          path: luce-base
      - name: Select Clang
        run: |
          mkdir -p "$RUNNER_TEMP/luce-bin"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/luce-bin/cc"
          echo "$RUNNER_TEMP/luce-bin" >> "$GITHUB_PATH"
      - name: Build the compiler
        working-directory: compiler/luce-base
        run: ./build.sh
      - name: Package gate
        working-directory: luce-std
        run: LUCE_BASE="$GITHUB_WORKSPACE/compiler/luce-base/build/luce-base" ./test.sh
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: luce-std-${{ matrix.runner }}-${{ github.sha }}
          path: |
            luce-std/build/*.log
            luce-std/build/failures/
          if-no-files-found: ignore
