# What the gate runs on each platform (luce-base tools/gate.py, docs/CI.md): bash commands
# in this checkout, in order, beside its dependencies at main, with LUCE_BASE and LUCE
# naming the toolchain the gate built.

[macos]
steps = ["./test.sh"]

[linux]
steps = ["./test.sh"]

[windows]
steps = [
    # every module's tests through both backends
    "python tests/run.py --base ../luce-base/build/luce-base.exe --skip-programs",
    # the Windows contracts
    """
    python tools/test_windows_native.py --compiler ../luce-base/build/luce-base.exe
    python tests/programs/net_protocols/run.py ../luce-base/build/luce-base.exe
    python tests/programs/crash_report/run.py ../luce-base/build/luce-base.exe
    python tests/programs/crash_follow/run.py ../luce-base/build/luce-base.exe
    """,
]
